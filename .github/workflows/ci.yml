name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }} / node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.11]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.os }}-

      - name: Typecheck / Lint / Test / Build
        run: pnpm turbo run typecheck lint test build

      - name: dsh smoke (root vitest + doctor)
        shell: bash
        run: |
          pnpm run test:root
          pnpm run doctor waifu
          pnpm run doctor chat-only
          pnpm run doctor mcp-headless

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/**/coverage/**
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------
  # E2E · headless（P8-8 + P9-11 · E1..E5 vitest 冒烟）
  # ---------------------------------------------------------------
  e2e-headless:
    name: e2e-headless (ubuntu-latest / node 20.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces (required for test:e2e imports)
        run: pnpm turbo run build

      - name: Run headless E2E (E1..E5)
        run: pnpm run test:e2e

  # ---------------------------------------------------------------
  # Changesets 校验（仅 PR）——涉及 fixed-group 三包必须附 changeset
  # ---------------------------------------------------------------
  changeset:
    name: changeset status
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify changeset status against baseBranch
        run: pnpm run changeset:status

  # ---------------------------------------------------------------
  # Electron 三平台打包冒烟：
  # - PR / push：仅在 ubuntu-latest 跑 AppImage 冒烟（快而免凭证）；
  # - tag `v*`：三平台矩阵，上传 artifact 供 Release 消费。
  # 签名/公证：仅在 tag build 且 secret 齐全时启用（缺失时 electron-builder 自动降级不签名）。
  # ---------------------------------------------------------------
  build-electron:
    name: build-electron (${{ matrix.os }})
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: package:prod:linux
            artifact: linux
          - os: macos-latest
            script: package:prod:mac
            artifact: mac
          - os: windows-latest
            script: package:prod:win
            artifact: win
    runs-on: ${{ matrix.os }}
    # PR / push 只跑 Linux；tag 触发时全平台。
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      matrix.os == 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm turbo run build

      - name: electron-builder package (${{ matrix.script }})
        env:
          # Windows / macOS 代码签名 —— 未注入 secret 时 electron-builder 会跳过 sign
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS 公证
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run ${{ matrix.script }}

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.AppImage
            dist/**/*.zip
            dist/**/*.blockmap
          if-no-files-found: warn
          retention-days: 14
