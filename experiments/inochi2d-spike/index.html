<!doctype html>
<html>
<head><meta charset="utf-8"><title>Inochi2D spike · Arch-chan</title>
<style>html,body{margin:0;background:#1e293b;overflow:hidden}#c{width:400px;height:600px;display:block}
#hud{position:fixed;left:8px;top:8px;font:12px monospace;color:#9cf;background:#0008;padding:4px 6px;white-space:pre}</style></head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<div id="hud">loading…</div>
<script type="module">
import init, { InoxModel, init_panic_hook } from './vendor/inochi_fox_demo.js';
const q = new URLSearchParams(location.search);
// inochi-avatar 内置 tracing-wasm 0.2.1：performance.measure 在当前 Chromium 下可能抛错 -> Rust panic。兜底为 no-throw。
for (const k of ['mark', 'measure']) { const f = performance[k].bind(performance); performance[k] = (...a) => { try { return f(...a); } catch { return undefined; } }; }
window.addEventListener('error', (e) => (window.__error = String(e.message)));
const hud = document.getElementById('hud');
const t0 = performance.now();
try {
  await init();
  try { init_panic_hook(); } catch {}
  const bytes = new Uint8Array(await (await fetch('./model/' + (q.get('model') || 'arch-chan.inp'))).arrayBuffer());
  const model = new InoxModel(bytes, 'c');
  const names = model.get_parameter_names();
  model.set_camera_scale(Number(new URLSearchParams(location.search).get('scale') || 0.12));
  model.set_camera_position(0, Number(new URLSearchParams(location.search).get('y') || 0));
  window.__inox = { model, names, loadMs: performance.now() - t0 };
  const find = (re) => names.find((n) => re.test(n));
  const head = find(/head/i), mouth = find(/mouth/i), eye = find(/eye|blink/i);
  let last = performance.now(), frames = 0;
  window.__mouth = 0; // 口型参数（lip-sync 驱动）
  function frame(now) {
    const dt = Math.min(Math.max((now - last) / 1000, 1 / 240), 1 / 30); last = now; frames++;
    try {
    model.begin_frame();
    const t = now / 1000;
    if (head) model.set_parameter_2d(head, Math.sin(t) * 0.6, Math.sin(t * 0.7) * 0.3);
    if (mouth) model.set_parameter(mouth, window.__mouth);
    model.end_frame(dt);
    model.draw();
    } catch (e) { window.__error = 'frame: ' + (e?.stack || e); hud.textContent = window.__error; return; }
    window.__frames = frames;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  hud.textContent = `model: ${model.get_name()}  load ${Math.round(window.__inox.loadMs)}ms\nparams(${names.length}): ${names.join(', ')}`;
  window.__ready = true;
} catch (e) { hud.textContent = 'ERROR ' + (e?.stack || e); window.__error = String(e); }
</script>
</body></html>
