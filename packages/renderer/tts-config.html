<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS语音配置</title>
    <script type="module" src="./src/tts-config/main.ts"></script>
  </head>
  <body>
    <main class="container cd-card" data-testid="tts-config">
      <header class="header">
        <h1>TTS 语音配置</h1>
        <p>配置文本转语音服务参数（支持语音克隆）。留空则使用系统语音。</p>
      </header>

      <div id="status-indicator" class="status-indicator none">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">未配置TTS服务，将使用系统语音</span>
      </div>

      <div class="editor-section cd-field">
        <label class="cd-field__label" for="config-editor">配置 JSON</label>
        <textarea
          id="config-editor"
          class="json-editor cd-textarea"
          spellcheck="false"
          placeholder="请输入TTS配置的JSON格式..."
        ></textarea>
        <div id="error-message" class="error-message" style="display: none"></div>
      </div>

      <div class="buttons">
        <button id="load-btn" class="cd-btn">
          <span>加载配置</span>
        </button>
        <button id="test-btn" class="cd-btn" disabled>
          <span id="test-icon">🔗</span>
          <span id="test-text">测试连接</span>
        </button>
        <button id="save-btn" class="cd-btn cd-btn--primary btn-wide" disabled>
          <span>保存配置</span>
        </button>
        <button id="reset-btn" class="cd-btn cd-btn--danger btn-wide">
          <span>重置配置</span>
        </button>
      </div>

      <div id="result-message" style="display: none"></div>

      <div class="help-text cd-notice">
        <strong>配置说明</strong><br />
        • <code>enabled</code>：是否启用 TTS 服务 (true/false)<br />
        • <code>hostname</code>：TTS 服务器地址<br />
        • <code>port</code>：TTS 服务器端口<br />
        • <code>path</code>：API 请求路径<br />
        • <code>audioUrl</code>：用于语音克隆的参考音频 URL<br />
        • <code>promptText</code>：提示文本内容
      </div>
    </main>

    <script>
      // 获取DOM元素
        const configEditor = document.getElementById('config-editor');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const errorMessage = document.getElementById('error-message');
        const resultMessage = document.getElementById('result-message');
        
        const loadBtn = document.getElementById('load-btn');
        const testBtn = document.getElementById('test-btn');
        const testIcon = document.getElementById('test-icon');
        const testText = document.getElementById('test-text');
        const saveBtn = document.getElementById('save-btn');
        const resetBtn = document.getElementById('reset-btn');

        // 默认配置模板
        const defaultConfig = {
            enabled: true,
            hostname: "example.com",
            port: 8443,
            path: "/voice_clone_direct",
            audioUrl: "https://example.com/audio.wav",
            promptText: "这是TTS语音测试文本，用于验证语音克隆功能是否正常工作。"
        };

        // 当前配置和状态
        let currentConfig = null;
        let isLoading = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('TTS配置页面已加载');
            console.log('ElectronAPI状态:', !!window.electronAPI);
            
            if (window.electronAPI) {
                console.log('ElectronAPI可用方法:', Object.keys(window.electronAPI));
            } else {
                console.warn('ElectronAPI不可用，将使用默认配置');
                showResult('ElectronAPI不可用，部分功能将不可使用', false);
            }
            
            loadCurrentConfig();
            
            // 监听JSON编辑器变化
            configEditor.addEventListener('input', handleEditorChange);
            
            // 按钮事件
            loadBtn.addEventListener('click', loadCurrentConfig);
            testBtn.addEventListener('click', testConnection);
            saveBtn.addEventListener('click', saveConfig);
            resetBtn.addEventListener('click', resetConfig);
        });

        // 处理编辑器内容变化
        function handleEditorChange() {
            const text = configEditor.value.trim();
            
            if (!text) {
                updateStatus('none', '未配置TTS服务，将使用系统语音');
                updateButtons(false, false);
                hideError();
                return;
            }

            try {
                const config = JSON.parse(text);
                const validation = validateConfig(config);
                
                if (validation.isValid) {
                    updateStatus('valid', '配置格式正确');
                    updateButtons(true, true);
                    hideError();
                } else {
                    updateStatus('invalid', '配置格式有误');
                    updateButtons(false, true);
                    showError(validation.errors.join('\\n'));
                }
            } catch (error) {
                updateStatus('invalid', 'JSON格式错误');
                updateButtons(false, true);
                showError('JSON格式错误: ' + error.message);
            }
        }

        // 验证配置
        function validateConfig(config) {
            const errors = [];

            if (typeof config.enabled !== 'boolean') {
                errors.push('enabled 必须是 true 或 false');
            }

            if (!config.hostname || typeof config.hostname !== 'string') {
                errors.push('hostname 是必需的字符串');
            }

            if (typeof config.port !== 'number' || config.port < 1 || config.port > 65535) {
                errors.push('port 必须是 1-65535 范围内的数字');
            }

            if (!config.path || typeof config.path !== 'string' || !config.path.startsWith('/')) {
                errors.push('path 必须是以 / 开头的字符串');
            }

            if (!config.audioUrl || typeof config.audioUrl !== 'string') {
                errors.push('audioUrl 是必需的字符串');
            } else {
                try {
                    new URL(config.audioUrl);
                } catch {
                    errors.push('audioUrl 必须是有效的URL');
                }
            }

            if (!config.promptText || typeof config.promptText !== 'string') {
                errors.push('promptText 是必需的字符串');
            }

            return {
                isValid: errors.length === 0,
                errors
            };
        }

        // 更新状态指示器
        function updateStatus(type, text) {
            statusIndicator.className = `status-indicator ${type}`;
            statusText.textContent = text;
        }

        // 更新按钮状态
        function updateButtons(testEnabled, saveEnabled) {
            testBtn.disabled = !testEnabled || isLoading;
            saveBtn.disabled = !saveEnabled || isLoading;
        }

        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            configEditor.classList.add('error');
        }

        // 隐藏错误信息
        function hideError() {
            errorMessage.style.display = 'none';
            configEditor.classList.remove('error');
        }

        // 显示结果消息
        function showResult(message, isSuccess) {
            resultMessage.textContent = message;
            resultMessage.className = `result-message cd-notice ${isSuccess ? 'cd-notice--success' : 'cd-notice--danger'}`;
            resultMessage.style.display = 'block';
            
            setTimeout(() => {
                resultMessage.style.display = 'none';
            }, 5000);
        }

        // 加载当前配置
        async function loadCurrentConfig() {
            if (!window.electronAPI) {
                configEditor.value = JSON.stringify(defaultConfig, null, 2);
                handleEditorChange();
                return;
            }

            try {
                setLoading(true);
                const config = await window.electronAPI.getTTSConfig();
                
                if (config) {
                    configEditor.value = JSON.stringify(config, null, 2);
                    currentConfig = config;
                } else {
                    configEditor.value = JSON.stringify(defaultConfig, null, 2);
                    currentConfig = null;
                }
                
                handleEditorChange();
                showResult('配置加载成功', true);
            } catch (error) {
                console.error('加载配置失败:', error);
                showResult('加载配置失败: ' + error.message, false);
                configEditor.value = JSON.stringify(defaultConfig, null, 2);
                handleEditorChange();
            } finally {
                setLoading(false);
            }
        }

        // 测试连接
        async function testConnection() {
            if (!window.electronAPI) {
                showResult('需要在Electron环境中运行', false);
                return;
            }

            try {
                const config = JSON.parse(configEditor.value);
                
                setLoading(true, 'test');
                const result = await window.electronAPI.testTTSConnection(config);
                
                if (result.success) {
                    showResult(`测试成功: ${result.message}${result.latency ? ` (延迟: ${result.latency}ms)` : ''}`, true);
                } else {
                    showResult(`测试失败: ${result.message}`, false);
                }
            } catch (error) {
                console.error('测试连接失败:', error);
                showResult('测试失败: ' + error.message, false);
            } finally {
                setLoading(false, 'test');
            }
        }

        // 保存配置
        async function saveConfig() {
            if (!window.electronAPI) {
                showResult('需要在Electron环境中运行', false);
                return;
            }

            try {
                const config = JSON.parse(configEditor.value);
                config.lastModified = Date.now();
                
                setLoading(true);
                await window.electronAPI.saveTTSConfig(config);
                
                currentConfig = config;
                showResult('配置保存成功！', true);
            } catch (error) {
                console.error('保存配置失败:', error);
                showResult('保存失败: ' + error.message, false);
            } finally {
                setLoading(false);
            }
        }

        // 重置配置
        async function resetConfig() {
            if (!confirm('确定要重置TTS配置吗？这将删除所有已保存的配置。')) {
                return;
            }

            if (!window.electronAPI) {
                configEditor.value = '';
                handleEditorChange();
                showResult('配置已重置（本地）', true);
                return;
            }

            try {
                setLoading(true);
                await window.electronAPI.resetTTSConfig();
                
                configEditor.value = '';
                currentConfig = null;
                handleEditorChange();
                showResult('配置已重置！现在将使用系统语音。', true);
            } catch (error) {
                console.error('重置配置失败:', error);
                showResult('重置失败: ' + error.message, false);
            } finally {
                setLoading(false);
            }
        }

        // 设置加载状态
        function setLoading(loading, type = 'general') {
            isLoading = loading;
            
            if (type === 'test') {
                if (loading) {
                    testIcon.innerHTML = '<span class="loading"></span>';
                    testText.textContent = '测试中...';
                    testBtn.disabled = true;
                } else {
                    testIcon.textContent = '🔗';
                    testText.textContent = '测试连接';
                    testBtn.disabled = !configEditor.value.trim() || !validateConfig(JSON.parse(configEditor.value || '{}')).isValid;
                }
            } else {
                loadBtn.disabled = loading;
                saveBtn.disabled = loading || !configEditor.value.trim() || !validateConfig(JSON.parse(configEditor.value || '{}')).isValid;
                resetBtn.disabled = loading;
            }
        }
    </script>
</body>
</html>
