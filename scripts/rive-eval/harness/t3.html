<!doctype html>
<html>
  <body style="margin: 0; background: transparent">
    <canvas id="c" width="480" height="560" style="width: 480px; height: 560px"></canvas>
    <script>
      const q = new URLSearchParams(location.search);
      const rt = q.get('rt') || 'canvas';
      window.__log = [];
      const s = document.createElement('script');
      s.src = `${rt}/rive.js`;
      s.onload = start;
      document.head.appendChild(s);
      function start() {
        const r = new rive.Rive({
          src: q.get('src') || 'nomi-poc.riv',
          canvas: document.getElementById('c'),
          animations: q.get('anim') || undefined,
          stateMachines: q.get('sm') || undefined,
          autoplay: true,
          autoBind: true,
          layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
          onLoad: () => {
            r.resizeDrawingSurfaceToCanvas();
            window.__log.push('loaded');
            window.ready = true;
          },
          onLoadError: (e) => window.__log.push('err ' + e),
        });
        window.R = r;
        window.fire = (n) => {
          const vm = r.viewModelInstance;
          vm.trigger(n).trigger();
        };
        window.frames = 0;
        (function c() {
          window.frames++;
          requestAnimationFrame(c);
        })();
        window.loopFire = (n, ms) => setInterval(() => window.fire(n), ms);
      }
    </script>
  </body>
</html>
